
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b16">
<title>Cina Games | Login</title>

<style>
:root {
  --bg: #050b16;
  --card: rgba(12, 24, 43, .88);
  --blue: #168bff;
  --cyan: #42dcff;
  --text: #f1f7ff;
  --muted: #8296b2;
  --border: rgba(93, 160, 230, .19);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 15px;
  overflow-x: hidden;
  position: relative;
  isolation: isolate;
}

/* Background slideshow */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-color: var(--bg);
  background-image:
    linear-gradient(
      135deg,
      rgba(3, 9, 22, .82),
      rgba(0, 20, 55, .78)
    ),
    url("bg1.jpg");
  background-position: center, center;
  background-size: cover, cover;
  background-repeat: no-repeat;
  animation: bgChange 25s infinite;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(0, 106, 255, .15),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(0, 217, 255, .12),
      transparent 35%
    );
}

@keyframes bgChange {
  0%, 19% {
    background-image:
      linear-gradient(rgba(3,9,22,.82), rgba(0,20,55,.78)),
      url("bg1.jpg");
  }

  20%, 39% {
    background-image:
      linear-gradient(rgba(3,9,22,.82), rgba(0,20,55,.78)),
      url("bg2.jpg");
  }

  40%, 59% {
    background-image:
      linear-gradient(rgba(3,9,22,.82), rgba(0,20,55,.78)),
      url("bg3.jpg");
  }

  60%, 79% {
    background-image:
      linear-gradient(rgba(3,9,22,.82), rgba(0,20,55,.78)),
      url("bg4.jpg");
  }

  80%, 100% {
    background-image:
      linear-gradient(rgba(3,9,22,.82), rgba(0,20,55,.78)),
      url("bg5.jpg");
  }
}

.grid-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background-image:
    linear-gradient(rgba(52, 144, 255, .15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(52, 144, 255, .15) 1px, transparent 1px);
  background-size: 38px 38px;
  mask-image: linear-gradient(to bottom, black, transparent);
  z-index: -1;
}

.wrapper {
  width: 100%;
  max-width: 440px;
  position: relative;
  z-index: 1;
  animation: appear .7s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.brand {
  text-align: center;
  margin-bottom: 25px;
}

.brand-logo {
  width: 70px;
  height: 70px;
  border-radius: 23px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  font-weight: 900;
  font-style: italic;
  color: white;
  background: linear-gradient(140deg, #168bff, #0752d8 60%, #062d79);
  border: 1px solid rgba(117, 207, 255, .65);
  box-shadow: 0 0 35px rgba(0, 115, 255, .32),
              inset 0 1px 1px rgba(255,255,255,.3);
}

.brand h1 {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand h1 span {
  color: var(--cyan);
}

.brand p {
  color: #c1d0e6;
  font-size: 12px;
  margin-top: 9px;
  letter-spacing: 1px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 28px;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 25px 80px rgba(0,0,0,.36),
              inset 0 1px 0 rgba(255,255,255,.035);
}

.tabs {
  display: flex;
  padding: 5px;
  background: #07111f;
  border: 1px solid var(--border);
  border-radius: 13px;
  gap: 5px;
  margin-bottom: 27px;
}

.tab {
  flex: 1;
  padding: 12px 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 13px;
  border-radius: 9px;
  cursor: pointer;
  transition: .25s;
}

.tab.active {
  color: white;
  background: linear-gradient(120deg, #147df0, #0758c9);
  box-shadow: 0 4px 16px rgba(0,112,255,.25);
}

.heading {
  margin-bottom: 23px;
}

.heading h2 {
  font-size: 21px;
  margin-bottom: 9px;
}

.heading p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.9;
}

/* Profile image */

.avatar-area {
  display: flex;
  justify-content: center;
  margin-bottom: 25px;
}

.avatar-wrap {
  position: relative;
  width: 95px;
  height: 95px;
}

.avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #168bff;
  background: linear-gradient(145deg, #102b4d, #07101f);
  box-shadow: 0 0 24px rgba(22,139,255,.2);
}

.avatar img {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-placeholder {
  font-size: 35px;
  color: #71caff;
}

.upload-btn {
  position: absolute;
  bottom: -2px;
  left: -4px;
  width: 32px;
  height: 32px;
  border: 2px solid var(--bg);
  border-radius: 50%;
  color: white;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: .2s;
}

.upload-btn:hover {
  transform: scale(1.1);
  background: #36b6ff;
}

#photoInput {
  display: none;
}

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;
  font-size: 12px;
  color: #c4d5e9;
  margin-bottom: 9px;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 49px;
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(3, 10, 21, .64);
  transition: .25s;
}

.input-wrap:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(22,139,255,.09);
}

.input-icon {
  color: #5a9bcf;
  font-size: 17px;
  flex-shrink: 0;
}

.input-wrap input {
  width: 100%;
  min-width: 0;
  background: transparent;
  color: white;
  border: 0;
  outline: none;
  font-family: inherit;
  font-size: 13px;
  direction: rtl;
  padding: 13px 0;
}

.input-wrap input::placeholder {
  color: #52647c;
}

.eye-btn {
  border: 0;
  background: transparent;
  color: #7896b9;
  cursor: pointer;
  font-size: 17px;
  padding: 5px;
}

.options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 5px 0 22px;
  font-size: 11px;
  color: var(--muted);
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.remember input {
  accent-color: var(--blue);
}

.text-btn {
  color: var(--cyan);
  background: none;
  border: none;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}

.submit-btn {
  width: 100%;
  min-height: 51px;
  border: 0;
  border-radius: 12px;
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(110deg, #0878f9, #0751d4);
  box-shadow: 0 7px 23px rgba(0,100,255,.22);
  transition: .25s;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0,120,255,.35);
}

.submit-btn:active {
  transform: scale(.985);
}

.notice {
  display: none;
  padding: 12px;
  border: 1px solid rgba(66,220,255,.2);
  background: rgba(15,130,220,.08);
  border-radius: 10px;
  color: #8fe5ff;
  font-size: 12px;
  line-height: 1.9;
  margin-bottom: 16px;
}

.footer {
  margin-top: 22px;
  text-align: center;
  color: #d0def0;
  font-size: 10px;
  line-height: 2;
}

.footer strong {
  color: #ffffff;
}

.security {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  color: #b3c8e2;
  font-size: 10px;
}

.security span {
  color: #43c8ff;
}

[hidden] {
  display: none !important;
}

@media (max-width: 420px) {
  body {
    padding: 20px 12px;
  }

  .card {
    padding: 22px 17px;
    border-radius: 20px;
  }

  .brand h1 {
    font-size: 26px;
  }

  .brand-logo {
    width: 62px;
    height: 62px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="grid-bg"></div>

<main class="wrapper">

  <header class="brand">
    <div class="brand-logo">CG</div>
    <h1>Cina <span>Games</span></h1>
    <p>YOUR WORLD. YOUR GAME.</p>
  </header>

  <section class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" type="button">
        ورود به حساب
      </button>
      <button class="tab" id="registerTab" type="button">
        ایجاد حساب
      </button>
    </div>

    <div class="heading">
      <h2 id="formTitle">خوش برگشتی! 👋</h2>
      <p id="formSubtitle">
        برای ورود به دنیای بازی‌ها، اطلاعاتت را وارد کن.
      </p>
    </div>

    <form id="authForm" novalidate>

      <div class="avatar-area">
        <div class="avatar-wrap">
          <div class="avatar">
            <span class="avatar-placeholder" id="avatarIcon">👤</span>
            <img id="avatarImage" alt="Profile preview">
          </div>

          <label for="photoInput"
                 class="upload-btn"
                 title="انتخاب عکس"
                 aria-label="انتخاب عکس پروفایل">+</label>

          <input type="file"
                 id="photoInput"
                 accept="image/*">
        </div>
      </div>

      <div class="field">
        <label for="username">نام کاربری یا ایمیل</label>
        <div class="input-wrap">
          <span class="input-icon">◎</span>
          <input id="username"
                 type="text"
                 placeholder="نام کاربری خود را وارد کن"
                 autocomplete="username"
                 required>
        </div>
      </div>

      <div class="field" id="emailField" hidden>
        <label for="email">ایمیل (اختیاری در این نمونه)</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input id="email"
                 type="email"
                 placeholder="example@email.com"
                 autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <div class="input-wrap">
          <span class="input-icon">⌑</span>
          <input id="password"
                 type="password"
                 placeholder="رمز عبور خود را وارد کن"
                 autocomplete="current-password"
                 required>
          <button class="eye-btn"
                  type="button"
                  id="togglePassword"
                  aria-label="نمایش رمز عبور">◉</button>
        </div>
      </div>

      <div class="field" id="confirmField" hidden>
        <label for="confirmPassword">تکرار رمز عبور</label>
        <div class="input-wrap">
          <span class="input-icon">⌑</span>
          <input id="confirmPassword"
                 type="password"
                 placeholder="رمز عبور را دوباره وارد کن"
                 autocomplete="new-password">
          <button class="eye-btn"
                  type="button"
                  id="toggleConfirm"
                  aria-label="نمایش تکرار رمز">◉</button>
        </div>
      </div>

      <div class="options" id="loginOptions">
        <label class="remember">
          <input type="checkbox" id="remember">
          مرا به خاطر بسپار
        </label>
        <button type="button" class="text-btn" id="forgotBtn">
          رمز را فراموش کردی؟
        </button>
      </div>

      <div class="notice" id="notice" role="status"
           aria-live="polite"></div>

      <button class="submit-btn" id="submitBtn" type="submit">
        ورود به حساب ←
      </button>

    </form>

    <div class="security">
      <span>◆</span>
      رابط کاربری نمایشی · Cina Games
    </div>

  </section>

  <footer class="footer">
    ساخته‌شده برای <strong>Cina Games</strong><br>
    Enter the game. Discover your world.
  </footer>

</main>

<script>
const $ = id => document.getElementById(id);

let mode = "login";
let selectedPhoto = null;

const form = $("authForm");
const notice = $("notice");

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function hideNotice() {
  notice.textContent = "";
  notice.style.display = "none";
}

function switchMode(nextMode) {
  mode = nextMode;
  hideNotice();

  const isRegister = mode === "register";

  $("loginTab").classList.toggle("active", !isRegister);
  $("registerTab").classList.toggle("active", isRegister);

  $("formTitle").textContent = isRegister
    ? "به خانواده ما بپیوند! 🚀"
    : "خوش برگشتی! 👋";

  $("formSubtitle").textContent = isRegister
    ? "حساب نمایشی خود را در Cina Games بساز."
    : "برای ورود به دنیای بازی‌ها، اطلاعاتت را وارد کن.";

  $("emailField").hidden = !isRegister;
  $("confirmField").hidden = !isRegister;
  $("loginOptions").hidden = isRegister;

  $("email").required = false;
  $("confirmPassword").required = isRegister;

  $("password").autocomplete = isRegister
    ? "new-password"
    : "current-password";

  $("submitBtn").textContent = isRegister
    ? "ایجاد حساب نمایشی ←"
    : "ورود به حساب ←";
}

$("loginTab").addEventListener("click", () => {
  switchMode("login");
});

$("registerTab").addEventListener("click", () => {
  switchMode("register");
});

function toggleVisibility(inputId, buttonId) {
  const input = $(inputId);
  const button = $(buttonId);
  const isHidden = input.type === "password";

  input.type = isHidden ? "text" : "password";
  button.textContent = isHidden ? "◎" : "◉";
  button.setAttribute(
    "aria-label",
    isHidden ? "مخفی کردن رمز" : "نمایش رمز"
  );
}

$("togglePassword").addEventListener("click", () => {
  toggleVisibility("password", "togglePassword");
});

$("toggleConfirm").addEventListener("click", () => {
  toggleVisibility("confirmPassword", "toggleConfirm");
});

// انتخاب عکس و نمایش پیش‌نمایش
$("photoInput").addEventListener("change", event => {
  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    showNotice("لطفاً یک فایل تصویری انتخاب کن.");
    event.target.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showNotice("حجم عکس باید کمتر از ۵ مگابایت باشد.");
    event.target.value = "";
    return;
  }

  if (selectedPhoto) {
    URL.revokeObjectURL(selectedPhoto);
  }

  selectedPhoto = URL.createObjectURL(file);

  $("avatarImage").src = selectedPhoto;
  $("avatarImage").style.display = "block";
  $("avatarIcon").style.display = "none";

  hideNotice();
});

// فرم نمایشی؛ هیچ اطلاعاتی به سرور فرستاده نمی‌شود
form.addEventListener("submit", event => {
  event.preventDefault();
  hideNotice();

  const username = $("username").value.trim();
  const password = $("password").value;
  const confirmPassword = $("confirmPassword").value;

  if (!username || !password) {
    showNotice("لطفاً نام کاربری و رمز عبور را وارد کن.");
    return;
  }

  if (password.length < 6) {
    showNotice("رمز عبور نمایشی باید حداقل ۶ کاراکتر باشد.");
    return;
  }

  if (mode === "register" && password !== confirmPassword) {
    showNotice("رمز عبور و تکرار آن یکسان نیستند.");
    return;
  }

  if (mode === "register") {
    showNotice(
      "ظاهر ثبت‌نام با موفقیت آزمایش شد! برای ساخت حساب واقعی، " +
      "اتصال به سیستم احراز هویت لازم است."
    );
  } else {
    showNotice(
      "فرم ورود درست کار می‌کند؛ اما ورود واقعی نیاز به " +
      "سیستم احراز هویت دارد."
    );
  }
});

$("forgotBtn").addEventListener("click", () => {
  showNotice(
    "بازیابی رمز عبور در این نسخه نمایشی فعال نیست."
  );
});

// جلوگیری از نمایش خطا هنگام تایپ مجدد
form.addEventListener("input", hideNotice);
</script>

</body>
</html>
